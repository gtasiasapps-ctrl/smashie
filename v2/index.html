<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smashie V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',sans-serif;
  background:#0a0908;color:#fff;overflow-x:hidden;
}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:#0a0908}
::-webkit-scrollbar-thumb{background:rgba(212,201,176,.15);border-radius:4px}
:root{
  --cream:#f0ebe0;
  --beige:#d4c9b0;
  --gold:#c9a94e;
  --light-cream:#f5f0e5;
  --dark:#0a0908;
  --border:rgba(212,201,176,.08);
}
#bg-scrim{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:url('smashie_background.jpg') center/cover no-repeat fixed;
  filter:brightness(0.5) saturate(0.5);
}
#bg-scrim .overlay{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,9,8,.5),rgba(10,9,8,.15) 40%,rgba(10,9,8,.3) 70%,rgba(10,9,8,.6));
}
#bg-canvas{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  z-index:0;pointer-events:none;
}
.content{position:relative;z-index:1}
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:.9rem 2.5rem;display:flex;justify-content:space-between;align-items:center;
  background:rgba(10,9,8,.6);backdrop-filter:blur(40px);
  border-bottom:1px solid var(--border);
  transition:transform .4s;
}
nav.hidden{transform:translateY(-100%)}
nav .logo-img{height:36px;width:auto;opacity:.9}
nav .links{display:flex;gap:2.5rem;align-items:center}
nav .links a{
  color:rgba(255,255,255,.4);text-decoration:none;font-size:.75rem;
  font-weight:500;letter-spacing:.1em;text-transform:uppercase;transition:color .3s;
}
nav .links a:hover{color:rgba(255,255,255,.8)}
nav .links .order-btn{
  padding:.55rem 1.6rem;
  background:linear-gradient(135deg,var(--beige),var(--gold));
  border-radius:100px;color:var(--dark)!important;font-weight:700;border:none;font-size:.75rem;
}
.mobile-toggle{display:none;font-size:1.5rem;cursor:pointer;color:rgba(255,255,255,.5);background:none;border:none}
@media(max-width:768px){
  nav{padding:.7rem 1.2rem}
  nav .logo-img{height:28px}
  nav .links{display:none;flex-direction:column;position:absolute;top:100%;left:0;right:0;
    background:rgba(10,9,8,.98);backdrop-filter:blur(40px);padding:1.5rem;gap:1.2rem;
    border-bottom:1px solid var(--border)}
  nav .links.open{display:flex}
  .mobile-toggle{display:block}
}
.hero{
  min-height:100vh;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;
  padding:8rem 2rem 4rem;
}
.hero .tag{
  display:inline-flex;align-items:center;gap:.6rem;
  padding:.35rem 1rem;background:rgba(212,201,176,.06);
  border:1px solid rgba(212,201,176,.1);border-radius:100px;
  font-size:.65rem;letter-spacing:.2em;color:var(--beige);margin-bottom:1.8rem;
}
.hero h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(3.5rem,14vw,9rem);font-weight:800;
  line-height:.92;letter-spacing:-.04em;
}
.hero h1 .accent{background:linear-gradient(135deg,var(--beige),var(--light-cream));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero .sub{font-size:clamp(.95rem,1.8vw,1.15rem);color:rgba(255,255,255,.35);max-width:460px;line-height:1.7;margin-top:1.5rem}
.hero .buttons{margin-top:2.5rem;display:flex;gap:1rem}
.hero .btn{padding:1rem 2.5rem;border-radius:100px;font-weight:600;font-size:.85rem;text-decoration:none;cursor:pointer;border:none}
.hero .btn-primary{background:linear-gradient(135deg,var(--beige),var(--gold));color:var(--dark)}
.hero .btn-outline{border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);background:transparent}
.hero .btn-outline:hover{border-color:var(--beige);color:#fff}
</style>
</head>
<body>

<div id="bg-scrim"><div class="overlay"></div></div>
<div id="bg-canvas"></div>

<nav id="nav">
  <img src="logo-2.png" alt="Smashie" class="logo-img" />
  <div class="links" id="navLinks">
    <a href="#menu">Menu</a>
    <a href="#reviews">Reviews</a>
    <a href="#experience">Experience</a>
    <a href="#contact">Contact</a>
    <a href="#" class="order-btn">Order Now</a>
  </div>
  <button class="mobile-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
</nav>

<div class="content">
<section class="hero">
  <div class="tag">✦ Est. 2025 · Athens</div>
  <h1>Smash<br><span class="accent">Perfection.</span></h1>
  <p class="sub">Angus beef, aged cheddar, caramelized onions. Every bite is a moment.</p>
  <div class="buttons">
    <a href="#menu" class="btn btn-primary">Explore Menu</a>
    <a href="#reviews" class="btn btn-outline">See Reviews</a>
  </div>
</section>
</div>

<script>
// ─── Minimal Three.js scene ───
const script = document.createElement('script');
script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
script.onload = function() {

  const canvas = document.getElementById('bg-canvas');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, premultipliedAlpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.domElement.style.background = 'transparent';
  canvas.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  const dl = new THREE.DirectionalLight(0xffffff, 2.0);
  dl.position.set(2, 5, 3);
  scene.add(dl);

  // Logo
  const tex = new THREE.TextureLoader().load('logo-2.png');
  const logo = new THREE.Mesh(
    new THREE.PlaneGeometry(2.5, 2.5),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
  );
  logo.position.set(0, 0.3, -3);
  scene.add(logo);

  // Particles (steam effect)
  const geo = new THREE.BufferGeometry();
  const particleCount = 300;
  const pos = new Float32Array(particleCount * 3);
  const vel = new Float32Array(particleCount);
  for (let i = 0; i < particleCount; i++) {
    pos[i*3] = (Math.random()-0.5)*4;
    pos[i*3+1] = (Math.random()-0.5)*3 + 2;
    pos[i*3+2] = (Math.random()-0.5)*4;
    vel[i] = 0.02 + Math.random() * 0.05;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pMat = new THREE.PointsMaterial({
    color: 0xd4c9b0, transparent: true, opacity: 0.15,
    size: 0.12, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const particles = new THREE.Points(geo, pMat);
  scene.add(particles);

  camera.position.set(0, 0.3, 5);
  camera.lookAt(0, 0.3, 0);

  let mx = 0, my = 0;
  document.addEventListener('mousemove', e => {
    mx = (e.clientX / window.innerWidth) * 2 - 1;
    my = -(e.clientY / window.innerHeight) * 2 + 1;
  });

  function animate() {
    requestAnimationFrame(animate);
    const t = performance.now() / 1000;
    
    logo.rotation.y = t * 0.3 + mx * 0.3;
    logo.position.y = 0.3 + Math.sin(t * 0.8) * 0.1;

    const p = particles.geometry.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      p[i*3] += Math.sin(t + i) * 0.003;
      p[i*3+1] += vel[i] * 0.02;
      p[i*3+2] += Math.cos(t * 0.5 + i) * 0.003;
      if (p[i*3+1] > 5) {
        p[i*3] = (Math.random()-0.5)*4;
        p[i*3+1] = 0;
        p[i*3+2] = (Math.random()-0.5)*4;
      }
    }
    particles.geometry.attributes.position.needsUpdate = true;

    camera.position.x += (mx * 1.5 - camera.position.x) * 0.05;
    camera.position.y += (my * 1.0 + 0.3 - camera.position.y) * 0.05;
    camera.lookAt(0, 0.3, -1);

    renderer.render(scene, camera);
  }
  animate();
};
document.head.appendChild(script);
</script>

</body>
</html>
